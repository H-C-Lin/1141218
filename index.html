<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宜蘭縣政府消防局｜到院前緊急救護作業程序手冊（114.12.18版）</title>
<style>
:root {
  --navy-950: #091a30;
  --navy-900: #0f2b4c;
  --navy-800: #163d6b;
  --navy-700: #1e508a;
  --navy-100: #e6eff9;
  --navy-50: #f2f7fc;
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50: #f8fafc;
  --white: #ffffff;
  --red-600: #dc2626;
  --red-700: #b91c1c;
  --red-100: #fee2e2;
  --red-50: #fef2f2;
  --amber-500: #f59e0b;
  --amber-200: #fde68a;
  --amber-100: #fef3c7;
  --emtp-bg: #fef08a;
  --emtp-border: #ca8a04;
  --emtp-text: #713f12;
  --teal-700: #0f766e;
  --teal-600: #0d9488;
  --teal-100: #ccfbf1;
  --teal-50: #f0fdfa;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.16);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --header-h: 60px;
  --sidebar-w: 276px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", system-ui, -apple-system, sans-serif;
  color: var(--slate-800);
  background: var(--slate-100);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

button, input { font-family: inherit; }

/* ===== Top Header ===== */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: linear-gradient(135deg, var(--navy-950), var(--navy-900));
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 1000;
  box-shadow: 0 2px 10px rgba(9, 26, 48, 0.25);
}

.menu-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}
.menu-btn:hover, .menu-btn:active { background: rgba(255,255,255,0.18); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  min-width: 0;
  flex: 1;
}
.brand-badge {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #fff;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
}
.brand-text { min-width: 0; }
.brand-title {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}
.brand-sub {
  font-size: 11px;
  color: #cbd5e1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.search-wrap {
  position: relative;
  width: 300px;
  max-width: 40vw;
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  height: 38px;
  padding: 0 34px 0 12px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  color: var(--white);
  font-size: 14px;
  outline: none;
  transition: background 0.15s, border-color 0.15s;
}
.search-input::placeholder { color: rgba(255,255,255,0.7); }
.search-input:focus {
  background: var(--white);
  color: var(--slate-900);
  border-color: var(--white);
}
.search-input:focus::placeholder { color: var(--slate-400); }
.search-clear {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  width: 28px; height: 28px;
  border: none; background: transparent;
  color: inherit; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  font-size: 15px; border-radius: 50%;
}
.search-clear.show { display: flex; }

.search-toggle-btn {
  display: none;
  align-items: center; justify-content: center;
  width: 44px; height: 44px;
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  color: var(--white); font-size: 18px;
  cursor: pointer; flex-shrink: 0;
}

.search-results {
  position: absolute;
  top: 44px; right: 0;
  width: 380px; max-width: calc(100vw - 24px);
  max-height: 70vh; overflow-y: auto;
  background: var(--white);
  color: var(--slate-800);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--slate-200);
  display: none;
  z-index: 1200;
}
.search-results.open { display: block; }
.search-result-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--slate-100);
  cursor: pointer;
  min-height: 44px;
}
.search-result-item:hover, .search-result-item:active { background: var(--navy-50); }
.search-result-item:last-child { border-bottom: none; }
.sr-title { font-weight: 700; font-size: 13px; color: var(--navy-800); display: flex; align-items: center; gap: 6px; }
.sr-snippet { font-size: 12.5px; color: var(--slate-600); margin-top: 2px; }
.sr-snippet mark { background: var(--emtp-bg); color: var(--slate-900); padding: 0 2px; border-radius: 2px; }
.sr-empty { padding: 16px; text-align: center; color: var(--slate-500); font-size: 13px; }

/* ===== Layout Shell ===== */
.app-shell {
  display: flex;
  padding-top: var(--header-h);
  min-height: 100vh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  z-index: 1050;
}
.sidebar-backdrop.open { display: block; }

.sidebar {
  position: fixed;
  top: var(--header-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--white);
  border-right: 1px solid var(--slate-200);
  overflow-y: auto;
  padding: 12px 10px 28px;
  z-index: 1100;
  transition: transform 0.22s ease;
}

.nav-group-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 12px 10px 6px;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  min-height: 44px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--slate-700);
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  line-height: 1.35;
}
.nav-item:hover { background: var(--slate-100); color: var(--navy-900); }
.nav-item.active {
  background: var(--navy-100);
  color: var(--navy-900);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--navy-700);
}
.nav-code {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--slate-100);
  color: var(--navy-800);
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}
.nav-item.active .nav-code { background: var(--navy-800); color: var(--white); }
.nav-label { flex: 1; min-width: 0; }
.tag-rev {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--red-100);
  color: var(--red-700);
  flex-shrink: 0;
}
.tag-emtp {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--emtp-bg);
  color: var(--emtp-text);
  border: 1px solid #eab308;
  flex-shrink: 0;
}

/* ===== Main Content ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  padding: 18px 22px 48px;
}

.page-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.page-title-wrap { min-width: 0; flex: 1; }
.page-kicker {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--slate-500);
  margin-bottom: 4px;
}
.page-title {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--navy-950);
  line-height: 1.3;
}
.page-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-300);
  background: var(--white);
  color: var(--slate-800);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s;
  max-width: 100%;
  white-space: normal;
  text-align: center;
}
.btn:hover { background: var(--slate-50); border-color: var(--slate-400); }
.btn-primary {
  background: var(--navy-800);
  border-color: var(--navy-800);
  color: var(--white);
}
.btn-primary:hover { background: var(--navy-700); }
.btn-teal {
  background: var(--teal-600);
  border-color: var(--teal-600);
  color: var(--white);
}
.btn-teal:hover { background: var(--teal-700); }
.btn-danger {
  background: var(--red-600);
  border-color: var(--red-600);
  color: var(--white);
}
.btn-sm { min-height: 36px; padding: 4px 10px; font-size: 12.5px; }

.mode-tabs {
  display: inline-flex;
  background: var(--slate-200);
  padding: 3px;
  border-radius: var(--radius-sm);
  gap: 3px;
}
.mode-tab {
  min-height: 36px;
  padding: 4px 12px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--slate-700);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.mode-tab.active {
  background: var(--white);
  color: var(--navy-900);
  box-shadow: var(--shadow-sm);
}

/* ===== Cards & Grids ===== */
.card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 16px;
}
.card-title {
  margin: 0 0 10px;
  font-size: 16px;
  font-weight: 700;
  color: var(--navy-900);
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-card {
  background: linear-gradient(135deg, var(--navy-900) 0%, #1d4e89 100%);
  color: var(--white);
  border: none;
  padding: 24px;
}
.hero-card h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.35; }
.hero-card p { margin: 0; color: #dbeafe; font-size: 14px; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
}
.hero-pill {
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.22);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.quick-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-md);
  padding: 14px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  min-height: 92px;
}
.quick-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--navy-700);
}
.qc-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.qc-code {
  font-size: 12px; font-weight: 800;
  padding: 2px 8px; border-radius: 6px;
  background: var(--navy-100); color: var(--navy-900);
}
.qc-name { font-size: 15px; font-weight: 700; color: var(--slate-900); line-height: 1.35; }
.qc-desc { font-size: 12.5px; color: var(--slate-500); }

/* ===== Flowchart Workspace ===== */
.flow-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr);
  gap: 16px;
  align-items: start;
}

.flow-canvas-card {
  padding: 0;
  overflow: hidden;
}
.flow-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  background: var(--slate-50);
  border-bottom: 1px solid var(--slate-200);
}
.flow-hint {
  font-size: 12px;
  color: var(--slate-600);
}
.zoom-controls {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.zoom-btn {
  min-width: 36px; min-height: 36px;
  padding: 0 8px;
  border: 1px solid var(--slate-300);
  border-radius: 6px;
  background: var(--white);
  color: var(--slate-800);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.zoom-btn:hover { background: var(--slate-100); }
.zoom-val { font-size: 12px; font-weight: 600; color: var(--slate-600); min-width: 42px; text-align: center; }

.svg-viewport {
  width: 100%;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: #ffffff;
  padding: 14px;
  min-height: 360px;
  max-height: 78vh;
  cursor: grab;
  touch-action: pan-x pan-y;
}
.svg-viewport:active { cursor: grabbing; }
.svg-inner {
  display: flex;
  justify-content: center;
  min-width: fit-content;
}
.svg-inner svg {
  display: block;
  max-width: none;
  flex-shrink: 0;
}

/* SVG Interactive Styles */
.svg-node { cursor: pointer; transition: filter 0.14s; }
.svg-node:hover .node-shape { filter: drop-shadow(0 3px 6px rgba(15, 43, 76, 0.22)); stroke-width: 2.4; }
.svg-node.active-node .node-shape { stroke: #0d9488 !important; stroke-width: 3.2 !important; filter: drop-shadow(0 0 8px rgba(13, 148, 136, 0.38)); }
.svg-node.visited-node .node-shape { stroke: #1e508a; stroke-width: 2.5; }
.node-text {
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  font-size: 13px;
  font-weight: 600;
  fill: #0f172a;
  pointer-events: none;
  user-select: none;
}
.node-text.red { fill: #b91c1c; }
.edge-label {
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 12px;
  font-weight: 700;
  fill: #1e3a5f;
}

/* ===== Notes & Checklists Panel ===== */
.notes-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.note-card {
  background: var(--white);
  border: 1px solid var(--slate-200);
  border-left: 4px solid var(--navy-700);
  border-radius: var(--radius-md);
  padding: 13px 15px;
  transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
  scroll-margin-top: 76px;
}
.note-card.highlight {
  background: #f0fdfa;
  border-color: var(--teal-600);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
}
.note-card.rev-note { border-left-color: var(--red-600); }
.note-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.note-badge {
  display: inline-block;
  font-size: 12.5px;
  font-weight: 800;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--navy-100);
  color: var(--navy-900);
}
.note-card.rev-note .note-badge { background: var(--red-100); color: var(--red-700); }
.note-body {
  font-size: 13.5px;
  color: var(--slate-700);
  white-space: pre-line;
}
.note-body .red-txt { color: var(--red-700); font-weight: 700; }
.note-body .emtp-inline {
  background: var(--emtp-bg);
  color: var(--emtp-text);
  padding: 0 4px;
  border-radius: 3px;
  font-weight: 700;
}

/* ===== Interactive Checklist ===== */
.checklist-card {
  background: var(--white);
  border: 1px solid #99f6e4;
  border-radius: var(--radius-md);
  padding: 14px 15px;
  background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 60%);
}
.cl-title {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--teal-700);
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cl-sub { font-size: 12px; color: var(--slate-600); margin: 0 0 10px; }
.cl-group-label {
  font-size: 12px; font-weight: 700; color: var(--slate-700);
  margin: 8px 0 4px;
}
.cl-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--slate-200);
  background: var(--white);
  margin-bottom: 6px;
  cursor: pointer;
  font-size: 13.5px;
}
.cl-item:hover { border-color: var(--teal-600); }
.cl-item input[type="checkbox"] {
  width: 20px; height: 20px;
  margin-top: 2px;
  accent-color: var(--teal-600);
  flex-shrink: 0;
  cursor: pointer;
}
.cl-status {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 700;
}
.cl-status.info { background: var(--slate-100); color: var(--slate-700); }
.cl-status.ok { background: var(--teal-100); color: #115e59; }
.cl-status.warn { background: var(--red-100); color: var(--red-700); }

/* ===== Walkthrough Mode ===== */
.wt-card {
  background: var(--white);
  border: 2px solid var(--navy-700);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
}
.wt-trail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.wt-crumb {
  font-size: 11.5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--slate-100);
  color: var(--slate-600);
}
.wt-step-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--navy-950);
  margin: 0 0 8px;
}
.wt-step-desc {
  font-size: 14px;
  color: var(--slate-700);
  margin: 0 0 14px;
  white-space: pre-line;
}
.wt-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.wt-opt-btn {
  min-height: 48px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--navy-700);
  background: var(--navy-50);
  color: var(--navy-900);
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  flex: 1 1 150px;
}
.wt-opt-btn:hover { background: var(--navy-800); color: var(--white); }
.wt-opt-btn.yes { border-color: var(--teal-600); background: var(--teal-50); color: var(--teal-700); }
.wt-opt-btn.yes:hover { background: var(--teal-600); color: var(--white); }
.wt-opt-btn.no { border-color: var(--red-600); background: var(--red-50); color: var(--red-700); }
.wt-opt-btn.no:hover { background: var(--red-600); color: var(--white); }

/* ===== Tables ===== */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-md);
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 580px;
  background: var(--white);
  font-size: 13.5px;

      { id: "註3", body: "自我保護包括：\n1、常規傳染病感染控制為戴手套及外科口罩；若眼睛可能受污染應配戴護目鏡；若須隔絕血或體液，可穿著隔離衣或袖套；若為新興傳染病或有不明原因感染症之虞應穿著合適防護衣。\n2、在防護措施未完備前，須與病患保持1公尺之安全距離包括：\n  (1) 具攻擊性之患者。\n  (2) 呼吸道傳染病之患者。" },

      { id: "註5", body: "大量傷病患係指單一事故、災害發生之傷病患人數達15人以上，或預判可能達15人以上時。\n1、現場應依災害之規模及種類，建立現場指揮協調系統，施行救護相關工作；參與急救之救護人員及救護運輸工具設置機關(構)，均應依現場指揮協調系統指揮施行救護。\n2、第一位到現場等級較高或較資深之EMT為現場指揮官（ICS commander），其餘後到的EMT均應聽從其指揮，待上級長官到達後，視情況進行指揮權轉移（Command transfer）。\n3、現場指揮官初期的作為包括：\n  (1) 確保安全（Safety）。\n  (2) 事故資訊（Size-up）。\n  (3) 狀況回報（Send Information）。" },
      { id: "註6", body: "特殊傷病患係指小兒、孕婦、老人或溺水傷病患等。" }
    ],
    walkthrough: {

      steps: {
        s1: { nodeId: "a1", title: "到達緊急救護現場：停車、安全與自我保護", desc: "確認救護車停泊於安全且隨時可開離的位置（交通事故依速限於後方 5–100 公尺放置警示標誌），確認現場無火災、爆炸、毒化物、暴力等危害，並完成手套、口罩等感染控制自我保護。", notes: ["註1", "註2", "註3"], options: [{ label: "確認現場安全並完成防護 → 評估救護能量", next: "s2", style: "yes" }] },
        s2: { nodeId: "a2", title: "傷病患及嚴重度是否超過救護能量？", desc: "判斷現場傷病患人數（如大量傷病患達 15 人以上）或嚴重度是否超出目前現場救護人力。", options: [{ label: "否（未超過救護能量）", next: "s3", style: "yes" }, { label: "是（超過救護能量）", next: "s4", style: "no" }] },
        s3: { nodeId: "a3", title: "進入非創傷／創傷／特殊傷病患流程", desc: "依傷病患屬性選擇對應標準作業流程（特殊傷病患係指小兒、孕婦、老人或溺水傷病患等）。", notes: ["註6"], jumps: [{ id: "flow-B", label: "前往 B.「非創傷」通用流程" }, { id: "flow-C", label: "前往 C.「創傷」通用流程" }] },

      { id: "註2", body: "1、頸椎可能有損傷或無法判定之創傷病患，救護人員在接觸傷患前應先從正面以語言指示方式令頸椎傷患頭頸部須保持不動之姿勢，並依傷患之姿勢給予頸椎保護。\n2、有相關速度或重力之危險創傷機轉情形必須考慮頸椎有損傷，應給予頸椎保護。可參考加拿大頸椎守則判斷。\n3、加拿大頸椎守則：\n  S：骨折大痛\n  P：後頸部中線壓痛\n  I：高速撞擊機轉\n  N：神經學異常\n  A：意識不清（含酒精）\n  L：脖子轉動受限(無法上下左右轉動45度)\n  只要符合SPINAL六項其中一項就需要上頸圈限制傷患頸椎移動。" },
      { id: "註3", body: "病患清醒時詢問本人，若無回應，則詢問家屬或身旁之人，病史詢問內容如下：\n1、之前：不舒服的症狀之前在做什麼？\n2、吃：最近一次進食時間？\n3、過：過去疾病史？\n4、藥：長期或近期有無服用任何藥物？\n5、敏：有無對食物或藥物過敏？\n6、感：有無其他感覺不舒服的地方？" },
      { id: "註4", revised: true, body: "1、評估呼吸道（A）：\n  是否通暢、是否有雜音。如不順暢，頸椎受傷傷患以下顎推舉法打開呼吸道，若無法打開時改以壓額抬下顎法打開呼吸道。必要時給予口咽、鼻咽等輔助呼吸道及抽吸。若發現嘴巴內有可見的異物或嘔吐物應先將其去除(要將傷患頭頸軀幹成一直線側翻)，然後再打開呼吸道，如無法清除，則進入『清除呼吸道異物』救護單項技術項目。\n2、評估呼吸（B）：\n  以看、聽方式評估呼吸深、淺、快、慢及有無明顯異常呼吸音(評估時間<10 秒)。\n3、評估循環（C）：\n  (1) 檢查兩側橈動脈或其他動脈點(評估時間<10 秒)，並評估周邊循環(目視膚色是否蒼白、發紺或異常，觸摸末端肢體是否濕冷，檢查微血管充填時間是否大於2秒)。\n  (2) 若有休克現象，需建立靜脈路徑，給予生理食鹽水靜脈輸注。若無法建立靜脈路徑，得使用骨針。\n      骨針(IO)使用須知：\n      A. 必要條件：病人年齡需大於 18 歲。\n      B. 適用時機：經嘗試執行靜脈注射無法成功。\n      C. 禁忌症：a.「施打位置」有骨折。b.「施打位置」有感染或燒燙傷。c.「施打位置」無法定位。d.「施打位置」有開刀過或安裝人工關節、義肢等。e. 48 小時內同一部位不能重複施打。\n  (3) EMTP遇出血性休克患者時，得依預立醫囑給予tranexamic acid注射。\n      使用劑量【以下擇一】（114.12.18 修訂）：\n      a. 抽取1,000mg Tranexamic acid加入 N/S 500 ml，全速滴注。\n      b. 2g，IV slow push。（114.12.18 新增）\n      tranexamic acid 1000mg適應症及禁忌症：\n      (1) 適應症，須全部符合：\n          a. 符合出血性休克之臨床表現。\n          b. 無法使用止血帶或壓迫止血無效之創傷(如胸、腹、骨盆腔、大腿內出血、高度懷疑或肢體軀幹交界處出血)。\n          c. 收縮壓<90mmHg或心跳≧120次/分鐘。\n          d. 創傷發生3小時以內。\n      (2) 禁忌症，需全部排除：\n          a. 正在接受凝血酶(Thrombin)給藥的病人。\n          b. 對tranexamic acid過敏。\n4、評估失能（D）：\n  (1) 檢查昏迷指數（GCS）\n  (2) 檢查眼睛瞳孔大小及是否對光有反應(註：意識清醒之傷病患不需檢查瞳孔)。\n  (3) 比較二側上肢和下肢的感覺和運動功能。\n5、評估傷患身體（E）：\n  (1) 快速視診頭、頸、胸、腹骨盆與肢體是否有穿刺傷、槍傷、臟器外露、大而深的傷口、瘀青、腫脹或變形等；檢查氣管是否偏移、頸靜脈是否怒張或塌陷；按壓頸椎是否異常、壓痛；骨盆是否穩定與疼痛等(骨盆檢查以一次為限)。\n  (2) 視情形將傷患衣物移除。\n6、輔助檢查：\n  初步評估過程中傷患有異常的現象，可採用儀器例如：血壓計、血氧濃度機、血糖機..等輔助檢查，並作重點式身體檢查。例如：傷患胸部有一彈孔，使用血氧監測輔助檢查，並針對胸部做聽診呼吸音，視診胸部起伏是否正常等重點式檢查；SPO2<94%應給予氧氣治療。其他詳細的身體檢查可在救護車上施行，以避免在救護現場耽誤而引起爭議。" },
      { id: "註5", body: "無適當呼吸即為沒有呼吸或瀕死式呼吸，呼吸<10次/分。" }

    notes: [
      { id: "註1", body: "傷病患上救護車，若有使用氧氣，將給氧設備之導管接至車裝氧氣上，然後關閉攜帶式氧氣筒。駕駛確認車廂之EMT無需協助後，上駕駛座前應先脫除手套，並儘速開車駛離現場，不得延誤後送。" },
      { id: "註2", body: "初步評估後之處置可能有下列項目：\n1、呼吸道處置：抽吸、清除呼吸道異物、使用口咽呼吸道或鼻咽呼吸道等。\n2、呼吸處置：給予氧氣或袋瓣罩甦醒球人工呼吸等。\n3、外出血控制：將持續出血之傷口加壓止血並包紮等。\n4、現場救護未完成之重點式身體檢查與輔助檢查。\n5、車上電擊：(車內照護流程)\n  (1) OHCA 患者於上車前曾使用AED 電擊：若車上仍無脈搏且AED分析建議電擊時，可不停車，直接施行電擊。\n  (2) OHCA患者但於上車前AED未曾建議電擊：若車上仍無脈搏且AED分析建議電擊時，可視路況尋找安全處停車進行AED 分析（送醫途中以停車1次為限），之後直接送達醫院。\n  (3) 送醫途中車上目擊OHCA 患者：後座人員立即開始CPR，視路況尋找安全處停車，駕駛人員下車協助進行AED 分析（送醫途中以停車1次為限），並視情況給於必要處置，儘速送醫。\n  (4) 如遇路況顛簸，EMT-P 可視狀況決定是否停車再次分析或直接電擊（包含手動與自動電擊）。\n  (5) AED 分析時，暫停自動心肺復甦機，以避免影響判斷。" },
      { id: "註3", body: "二度評估包括生命徵象(意識或昏迷指數、呼吸、脈搏、血壓、瞳孔、體溫、膚色與血氧濃度)評估及身體檢查。" },
      { id: "註4", body: "原則上OHCA患者若於現場已接受電擊，開車前建議再次分析心律以決定是否需要再次電擊。\n應於CPR每5循環或約2分鐘檢查脈搏以決定是否繼續CPR，被授權可實施高級生命救護處置(Advanced Life Support, ALS)的高級救護技術員得視裝備及需要監測心律，再決定後續處置。" },
      { id: "註5", body: "無線電報告應包含下列事項：\n1、自我介紹、傷病患性別、大約年齡、主訴與主要問題。\n2、對傷病患已做之主要處置。\n3、傷病患目前的異常生命徵象。\n4、大約多久到達醫院。\n危急個案(包含疑似腦中風、缺血性胸痛發作或重大創傷)得於離開現場後主動告知接收醫院，請醫院先行準備。" },
      { id: "註6", body: "1、抵達醫院前應持續監測傷病患之生命徵象。\n2、危急個案應至少每5分鐘測量1次，且要持續血氧濃度監測。\n3、非危急個案至少每15分鐘測量1次，視傷病患需要或病情有變化時(如意識改變)，應重新評估傷病患，並再以無線電告知接收之急救責任醫院。\n4、送醫途中傷病患轉為OHCA時，應立即通知駕駛停車，並於車上完成到院前心肺功能停止患者救護流程。\n5、送醫途中有新的且有意義的發現，應主動回報後送醫院。\n6、給予袋瓣罩甦醒球人工呼吸或心肺復甦術之傷病患應約每2分鐘重新評估呼吸或頸動脈搏。" }

      { id: "註1", body: "1、到達急診前50-100公尺時，應視交通情形關閉或調低警鳴器音量。\n2、救護車停放於醫院急診室指定之停車位置並熄火。\n3、除非傷病患要求自行下車，救護人員應讓傷病患躺在擔架床上，並小心將其由後車門移出。傷病患要求自行下車時，救護人員亦應在旁保護並引導其從側門下車。\n4、下救護車前，應整備所有使用中之救護裝備，並同時對傷病患做最後審視，盡可能延續所有施行中之處置，直到救護車送至急診檢傷站，然後協助換至急診推床；施行心肺復甦術之傷病患應直入急診急救室，並視狀況給予急診醫護人員必要協助；若為危急個案或生命徵象急不穩定之傷病患應協同急診醫護人員送入急救室或重傷病區。" },

    notes: [
      { id: "註1", body: "無意識、10秒內評估無適當呼吸及沒有摸到頸動脈搏。" },
      { id: "註2", body: "若有機械式壓胸裝置，可考慮裝設使用，如人力足夠，應在離開現場前架設並離開現場。使用機械式壓胸裝置後，應注意每兩分鐘需重新評估心律及脈搏。" },
      { id: "註3", body: "一人開始施行胸部按壓，另一人應在不中斷CPR下盡速使用AED，患者如已使用PAD (公眾自動體外心臟電擊去顫器)，本局救護人員到場接手後，仍應更換為救護車上之AED，避免造成該公共場所無AED可使用。" },
      { id: "註4", body: "應在AED語音指示至聽到不要碰觸「病人」時，所有人應中斷任何碰觸病人的動作，若要電擊去顫時應再次確認無任何人碰觸到患者。準備離開前，應依 AED 語音指示判斷執行電擊或不電擊後，將患者搬運上車，保持AED開機，每2分鐘評估患者脈搏及心律，必要時得停靠安全處重新評估心律，以決定是否執行電擊。" },
      { id: "註5", body: "去顫或不去顫後都要立即胸部按壓，重新開始5循環或約2分鐘的CPR。" },
      { id: "註6", body: "1、救護人員一人持續進行CPR，另一人嘗試建立周邊血管路徑(IV/IO)。\n2、EMTP遇有心臟停止之病患得依據事先訂定之醫囑，於建立周邊血管路徑(IV/IO)後，每3至5分鐘給予Epinephrine 1mg IV push之處置。另經AED電擊二次，倘若以上用藥效果不彰，則可考慮給予Amiodarone (第一次300mg靜脈快速注射，然後視必要每次150mg靜脈快速注射)。\n3、骨針(IO)使用須知：\n  (1) 必要條件：病人年齡需大於 18 歲。\n  (2) 適用時機：經嘗試執行靜脈注射無法成功。\n  (3) 禁忌症：\n      1、「施打位置」有骨折。\n      2、「施打位置」有感染或燒燙傷。\n      3、「施打位置」無法定位。\n      4、「施打位置」有開刀過或安裝人工關節、義肢等。\n      5、48 小時內同一部位不能重複施打。" },
      { id: "註7", body: "1、救護人員一人持續進行CPR，另一人應施行袋瓣罩甦醒球，給予氧氣並建立聲門上呼吸道，若聲門上呼吸道無法置入，次選擇才為口咽(需註明原因)。\n2、如救護人員皆為EMT-1出勤，則建立口咽呼吸道。\n3、進階呼吸道(限EMTP操作)：\n   建立氣管內管以一次為限，若建立失敗後，應立即考慮其他輔助呼吸道。" },
      { id: "註8", body: "1、依患者意識、口鼻分泌物、嘔吐物等，評估患者呼吸道，若無法確保且病患未被建立進階呼吸道，應使用替代或進階呼吸道。\n2、若已確保病人呼吸道，仍無適當呼吸或呼吸動力不足，應給予正壓給氧；若有適當呼吸，應依照血氧濃度給予氧氣。\n3、ROSC後應測病人脈搏、血壓，若患者收縮壓小於90mmHg，應給予生理食鹽水500-1000毫升快速滴注。如無法測量血壓，得以動脈點測量替代。\n4、ROSC後得執行12導程心電圖。" }

// ===== 頁面切換 =====
function navigate(pageId, opts = {}) {
  if (!opts.isBack && state.currentPage && state.currentPage !== pageId) {
    state.historyStack.push(state.currentPage);
    if (state.historyStack.length > 20) state.historyStack.shift();
  }
  state.currentPage = pageId;
  state.flowMode = opts.mode || "chart";
  state.activeNodeId = null;
  state.zoom = 1;

  const flow = FLOWS.find(f => f.id === pageId);
  if (flow && flow.walkthrough) {
    state.wtStep = flow.walkthrough.start;
    state.wtTrail = [flow.walkthrough.start];
  } else {
    state.wtStep = null;
    state.wtTrail = [];
  }

  renderSidebar();
  renderPage(opts.highlightNote || null);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goBack() {
  if (state.historyStack.length > 0) {
    const prev = state.historyStack.pop();
    navigate(prev, { isBack: true });
  }
}

// ===== 主內容渲染 =====
function renderPage(highlightNoteId = null) {
  const main = $("#mainContent");
  if (state.currentPage === "home") {
    renderHome(main);
  } else if (state.currentPage === "history") {
    renderHistory(main);
  } else if (state.currentPage === "part1") {
    renderPart1(main);
  } else {
    const flow = FLOWS.find(f => f.id === state.currentPage);
    if (flow) renderFlow(main, flow, highlightNoteId);
  }
}

  main.innerHTML = `

          ${flow.revised ? `<span class="tag-rev">${escapeHtml(flow.revised)}</span>` : ""}
          ${flow.emtp ? `<span class="tag-emtp">含 EMTP 預立醫囑</span>` : ""}
        </div>
        <h2 class="page-title">${escapeHtml(flow.title)}</h2>
      </div>
      <div class="page-actions">
        ${state.historyStack.length ? `<button class="btn btn-sm" id="backBtn">← 返回上一頁</button>` : ""}
        <div class="mode-tabs" role="tablist">
          <button class="mode-tab ${!isWT ? "active" : ""}" id="tabChart">全景流程圖</button>
          <button class="mode-tab ${isWT ? "active" : ""}" id="tabWT">逐步決策引導</button>
        </div>
      </div>
    </div>

    ${isWT ? renderWalkthroughCard(flow) : ""}

    <div class="flow-layout">
      <div class="card flow-canvas-card">
        <div class="flow-toolbar">
          <span class="flow-hint">點擊節點查看註解，含 ↗ 符號可跳轉至關聯流程</span>
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut" aria-label="縮小">−</button>
            <span class="zoom-val" id="zoomVal">100%</span>
            <button class="zoom-btn" id="zoomIn" aria-label="放大">＋</button>
            <button class="zoom-btn" id="zoomFit">符合寬度</button>
          </div>
        </div>
        <div class="svg-viewport" id="svgViewport">
          <div class="svg-inner" id="svgInner">
            ${buildFlowSvg(flow.viewBox, flow.nodes, flow.edges, activeId, visitedNodes)}
          </div>
        </div>
      </div>

      <div class="notes-panel" id="notesPanel">
        ${(flow.checklists || []).map(cl => renderChecklistHtml(cl)).join("")}
        ${flow.notes.map(n => `
          <div class="note-card ${n.revised ? "rev-note" : ""} ${highlightNoteId === n.id ? "highlight" : ""}" id="note-${n.id}" data-note-id="${n.id}">
            <div class="note-head">
              <span class="note-badge">（${escapeHtml(n.id)}）</span>
              ${n.revised ? `<span class="tag-rev">114.12.18 修訂／新增</span>` : ""}
            </div>
            <div class="note-body">${formatNoteBody(n.body)}</div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="footer-note">資料來源：${escapeHtml(MANUAL_META.sourceFile)}（${escapeHtml(flow.pages)}）</div>
  `;

  bindZoomControls(flow.viewBox[0], flow.viewBox[1]);
  bindChecklists(flow.checklists || []);

  const backBtn = $("#backBtn");
  if (backBtn) backBtn.addEventListener("click", goBack);
  $("#tabChart").addEventListener("click", () => { state.flowMode = "chart"; renderFlow(main, flow); });
  $("#tabWT").addEventListener("click", () => {
    state.flowMode = "walkthrough";
    if (!state.wtStep && flow.walkthrough) {
      state.wtStep = flow.walkthrough.start;
      state.wtTrail = [flow.walkthrough.start];
    }
    renderFlow(main, flow);
  });

  if (isWT) bindWalkthroughEvents(main, flow);

  // SVG 節點點擊事件
  main.querySelectorAll(".svg-node").forEach(el => {
    el.addEventListener("click", () => {
      const node = flow.nodes.find(n => n.id === el.dataset.nodeId);
      if (!node) return;
      state.activeNodeId = node.id;
      main.querySelectorAll(".svg-node").forEach(x => x.classList.remove("active-node"));
      el.classList.add("active-node");

      const matchedNotes = (node.notes || []).map(nid => flow.notes.find(x => x.id === nid)).filter(Boolean);

      // 若為純跳轉節點且無註解，直接跳轉
      if (node.jump && matchedNotes.length === 0) {
        navigate(node.jump);
        return;
      }

      // 高亮對應註解
      main.querySelectorAll(".note-card").forEach(c => c.classList.remove("highlight"));
      matchedNotes.forEach(n => {
        const card = $(`#note-${CSS.escape(n.id)}`);
        if (card) card.classList.add("highlight");
      });

      // 手機／平板直向（< 1024px）彈出 Bottom Sheet 快速閱讀
      if (window.innerWidth < 1024 && (matchedNotes.length > 0 || node.jump)) {
        const targetFlow = node.jump ? FLOWS.find(f => f.id === node.jump) : null;
        const bodyHtml = `
          ${matchedNotes.map(n => `
            <div class="note-card ${n.revised ? "rev-note" : ""}" style="margin-bottom:10px;">
              <div class="note-head"><span class="note-badge">（${escapeHtml(n.id)}）</span>${n.revised ? '<span class="tag-rev">114.12.18</span>' : ''}</div>
              <div class="note-body">${formatNoteBody(n.body)}</div>
            </div>
          `).join("")}
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
            ${targetFlow ? `<button class="btn btn-primary" id="sheetJumpBtn" style="flex:1;">前往 ${escapeHtml(targetFlow.title)} ↗</button>` : ""}
            ${matchedNotes.length ? `<button class="btn" id="sheetScrollBtn" style="flex:1;">捲動至下方完整註解</button>` : ""}
          </div>
        `;
        openBottomSheet(node.lines.join(" "), bodyHtml);
        const jb = $("#sheetJumpBtn");
        if (jb && targetFlow) jb.addEventListener("click", () => { closeBottomSheet(); navigate(targetFlow.id); });
        const sb = $("#sheetScrollBtn");
        if (sb && matchedNotes[0]) sb.addEventListener("click", () => {
          closeBottomSheet();
          const card = $(`#note-${CSS.escape(matchedNotes[0].id)}`);
          if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      } else if (matchedNotes.length > 0) {
        const firstCard = $(`#note-${CSS.escape(matchedNotes[0].id)}`);
        if (firstCard) firstCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
  });

  if (highlightNoteId) {
    setTimeout(() => {
      const card = $(`#note-${CSS.escape(highlightNoteId)}`);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 80);
  }
}

function formatNoteBody(text) {
  let s = escapeHtml(text);
  s = s.replace(/(【114\.12\.18[^】]*】|2g，IV slow push。（114\.12\.18 新增）)/g, '<span class="red-txt">$1</span>');
  s = s.replace(/(EMTP|EMT-P|EMT2|EMT-1)/g, '<span class="emtp-inline">$1</span>');
  return s;
}

// ===== 逐步決策引導卡片 =====
function renderWalkthroughCard(flow) {
  if (!flow.walkthrough) return "";
  const step = flow.walkthrough.steps[state.wtStep] || flow.walkthrough.steps[flow.walkthrough.start];
  const stepNotes = (step.notes || []).map(nid => flow.notes.find(x => x.id === nid)).filter(Boolean);

  return `
    <div class="wt-card" id="wtCard">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <span class="note-badge" style="background:var(--navy-800);color:#fff;">逐步決策引導模式（第 ${state.wtTrail.length} 步）</span>
        <div style="display:flex;gap:6px;">
          ${state.wtTrail.length > 1 ? `<button class="btn btn-sm" id="wtPrevBtn">← 上一步</button>` : ""}
          <button class="btn btn-sm" id="wtResetBtn">↻ 重新開始</button>
        </div>
      </div>
      <div class="wt-trail">
        ${state.wtTrail.map((sid, idx) => {
          const st = flow.walkthrough.steps[sid];
          return `<span class="wt-crumb">${idx + 1}. ${escapeHtml((st?.title || "").slice(0, 14))}${(st?.title || "").length > 14 ? "…" : ""}</span>`;
        }).join("")}
      </div>
      <h3 class="wt-step-title">${escapeHtml(step.title)}</h3>
      <p class="wt-step-desc">${escapeHtml(step.desc)}</p>

      ${stepNotes.length ? `
        <div style="margin-bottom:14px;">
          ${stepNotes.map(n => `
            <div class="note-card ${n.revised ? "rev-note" : ""}" style="margin-bottom:8px;background:var(--slate-50);">
              <div class="note-head"><span class="note-badge">參考（${escapeHtml(n.id)}）</span></div>
              <div class="note-body">${formatNoteBody(n.body)}</div>
            </div>
          `).join("")}
        </div>
      ` : ""}

      <div class="wt-options">
        ${(step.options || []).map((opt, idx) => `
          <button class="wt-opt-btn ${opt.style || ""}" data-wt-next="${opt.next}" data-opt-idx="${idx}">${escapeHtml(opt.label)}</button>
        `).join("")}
        ${(step.jumps || []).map(j => `
          <button class="wt-opt-btn yes" data-wt-jump="${j.id}">${escapeHtml(j.label)} ↗</button>
        `).join("")}
      </div>
    </div>
  `;
}

function bindWalkthroughEvents(main, flow) {
  const prevBtn = $("#wtPrevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => {
    if (state.wtTrail.length > 1) {
      state.wtTrail.pop();
      state.wtStep = state.wtTrail[state.wtTrail.length - 1];
      renderFlow(main, flow);
    }
  });
  const resetBtn = $("#wtResetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    state.wtStep = flow.walkthrough.start;
    state.wtTrail = [flow.walkthrough.start];
    renderFlow(main, flow);
  });
  main.querySelectorAll("[data-wt-next]").forEach(btn => {
    btn.addEventListener("click", () => {
      const next = btn.dataset.wtNext;
      state.wtStep = next;
      state.wtTrail.push(next);
      renderFlow(main, flow);
    });
  });
  main.querySelectorAll("[data-wt-jump]").forEach(btn => {
    btn.addEventListener("click", () => navigate(btn.dataset.wtJump, { mode: "walkthrough" }));
  });
}

// ===== 互動式檢核清單 =====
function renderChecklistHtml(cl) {
  let body = "";
  if (cl.mode === "ind_contra") {
    body = `
      <div class="cl-group-label" style="color:var(--teal-700);">✔ 適應症／必要條件（須全部符合）</div>
      ${cl.indications.map((txt, i) => `
        <label class="cl-item"><input type="checkbox" data-cl="${cl.id}" data-group="ind" value="${i}"><span>${escapeHtml(txt)}</span></label>
      `).join("")}
      <div class="cl-group-label" style="color:var(--red-700);">✖ 禁忌症（須全部排除；如有請勾選）</div>
      ${cl.contraindications.map((txt, i) => `
        <label class="cl-item"><input type="checkbox" data-cl="${cl.id}" data-group="contra" value="${i}"><span>${escapeHtml(txt)}</span></label>
      `).join("")}
    `;
  } else {
    body = cl.items.map((txt, i) => `
      <label class="cl-item"><input type="checkbox" data-cl="${cl.id}" data-group="item" value="${i}"><span>${escapeHtml(txt)}</span></label>
    `).join("");
  }

  return `
    <div class="checklist-card" id="box-${cl.id}">
      <div class="cl-title">
        <span>☑ ${escapeHtml(cl.title)}</span>
        <button class="btn btn-sm" data-cl-reset="${cl.id}" style="min-height:30px;padding:2px 8px;font-size:11.5px;">清除</button>
      </div>
      <p class="cl-sub">${escapeHtml(cl.sub)}</p>
      ${body}
      <div class="cl-status info" id="status-${cl.id}"></div>
    </div>
  `;
}

function bindChecklists(checklists) {
  const evalCl = (cl) => {
    const statusEl = $(`#status-${cl.id}`);
    if (!statusEl) return;
    if (cl.mode === "any") {
      const checked = document.querySelectorAll(`input[data-cl="${cl.id}"]:checked`).length;
      statusEl.className = `cl-status ${checked > 0 ? "warn" : "info"}`;
      statusEl.textContent = checked > 0 ? cl.msgMatch : cl.msgNone;
    } else if (cl.mode === "all") {
      const total = cl.items.length;
      const checked = document.querySelectorAll(`input[data-cl="${cl.id}"]:checked`).length;
      statusEl.className = `cl-status ${checked === total ? "ok" : "info"}`;
      statusEl.style.whiteSpace = "pre-line";
      statusEl.textContent = checked === total ? cl.msgAll : `${cl.msgIncomplete}（目前符合 ${checked}/${total} 項）`;
    } else if (cl.mode === "contra_only") {
      const checked = document.querySelectorAll(`input[data-cl="${cl.id}"]:checked`).length;
      statusEl.className = `cl-status ${checked > 0 ? "warn" : "ok"}`;
      statusEl.textContent = checked > 0 ? cl.msgWarn : cl.msgSafe;
    } else if (cl.mode === "ind_contra") {
      const indTotal = cl.indications.length;
      const indChecked = document.querySelectorAll(`input[data-cl="${cl.id}"][data-group="ind"]:checked`).length;
      const contraChecked = document.querySelectorAll(`input[data-cl="${cl.id}"][data-group="contra"]:checked`).length;
      statusEl.style.whiteSpace = "pre-line";
      if (contraChecked > 0) {
        statusEl.className = "cl-status warn";
        statusEl.textContent = cl.msgContra;
      } else if (indChecked === indTotal) {
        statusEl.className = "cl-status ok";
        statusEl.textContent = cl.msgOk;
      } else {
        statusEl.className = "cl-status info";
        statusEl.textContent = `${cl.msgIncomplete}（適應症已符合 ${indChecked}/${indTotal} 項）`;
      }
    }
  };

  checklists.forEach(cl => {
    evalCl(cl);
    document.querySelectorAll(`input[data-cl="${cl.id}"]`).forEach(inp => {
      inp.addEventListener("change", () => evalCl(cl));
    });
    const resetBtn = document.querySelector(`[data-cl-reset="${cl.id}"]`);
    if (resetBtn) resetBtn.addEventListener("click", () => {
      document.querySelectorAll(`input[data-cl="${cl.id}"]`).forEach(inp => { inp.checked = false; });
      evalCl(cl);
    });
  });
}

// ===== SVG 流程圖建構引擎 =====
function buildFlowSvg(viewBox, nodes, edges, activeNodeId, visitedNodes) {
  const [vw, vh] = viewBox;
  const edgeSvg = edges.map(e => {
    const pts = e.points.map(p => `${p[0]},${p[1]}`).join(" ");
    let labelSvg = "";
    if (e.label && e.labelPos) {
      const [lx, ly] = e.labelPos;
      labelSvg = `
        <rect x="${lx - 26}" y="${ly - 11}" width="52" height="17" rx="4" fill="#ffffff" opacity="0.92"></rect>
        <text x="${lx}" y="${ly + 2}" text-anchor="middle" class="edge-label">${escapeHtml(e.label)}</text>
      `;
    }
    return `<polyline points="${pts}" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" stroke-linejoin="round" />${labelSvg}`;
  }).join("");

  const nodeSvg = nodes.map(n => {
    const cx = n.x + n.w / 2;
    const cy = n.y + n.h / 2;
    let fill = "#ffffff", stroke = "#1e3a5f", strokeW = 1.6;
    if (n.type === "pill") { fill = "#f2f7fc"; stroke = "#0f2b4c"; strokeW = 1.9; }
    if (n.type === "diamond") { fill = "#f8fafc"; stroke = "#1e508a"; strokeW = 1.8; }
    if (n.type === "emtp") { fill = "#fef9c3"; stroke = "#ca8a04"; strokeW = 2; }
    if (n.type === "red") { fill = "#fef2f2"; stroke = "#dc2626"; strokeW = 2; }

    let shape = "";
    if (n.type === "diamond") {
      const pts = `${cx},${n.y} ${n.x + n.w},${cy} ${cx},${n.y + n.h} ${n.x},${cy}`;
      shape = `<polygon class="node-shape" points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />`;
    } else if (n.type === "pill") {
      shape = `<rect class="node-shape" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${Math.min(24, n.h / 2)}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />`;
    } else {
      shape = `<rect class="node-shape" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />`;
    }

    const lineH = 17;
    const startY = cy - ((n.lines.length - 1) * lineH) / 2 + 4.5;
    const textSvg = n.lines.map((line, i) => `
      <text x="${cx}" y="${startY + i * lineH}" text-anchor="middle" class="node-text ${n.type === "red" ? "red" : ""}">${escapeHtml(line)}</text>
    `).join("");

    const badgeSvg = n.badge ? `
      <rect x="${n.x + 6}" y="${n.y - 10}" width="22" height="18" rx="4" fill="#facc15" stroke="#a16207" stroke-width="1" />
      <text x="${n.x + 17}" y="${n.y + 3}" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#713f12;">${escapeHtml(n.badge)}</text>
    ` : "";

    const jumpSvg = n.jump ? `
      <rect x="${n.x + n.w - 26}" y="${n.y - 10}" width="22" height="18" rx="4" fill="#0f2b4c" />
      <text x="${n.x + n.w - 15}" y="${n.y + 3}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#ffffff;">↗</text>
    ` : "";

    const cls = [
      "svg-node",
      activeNodeId === n.id ? "active-node" : "",
      visitedNodes.includes(n.id) ? "visited-node" : ""
    ].filter(Boolean).join(" ");

    return `<g class="${cls}" data-node-id="${n.id}" role="button" tabindex="0">${shape}${textSvg}${badgeSvg}${jumpSvg}</g>`;
  }).join("");

  return `
    <svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" viewBox="0 0 ${vw} ${vh}">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
        </marker>
      </defs>
      ${edgeSvg}
      ${nodeSvg}
    </svg>
  `;
}

// ===== 流程圖縮放與拖曳控制（桌機／平板／手機自適應） =====
function bindZoomControls(svgWidth, svgHeight) {
  const viewport = $("#svgViewport");
  const inner = $("#svgInner");
  const valEl = $("#zoomVal");
  if (!viewport || !inner) return;
  const svg = inner.querySelector("svg");

  const applyZoom = (z) => {
    state.zoom = Math.max(0.42, Math.min(1.8, z));
    if (svg) {
      svg.style.width = `${Math.round(svgWidth * state.zoom)}px`;
      svg.style.height = `${Math.round(svgHeight * state.zoom)}px`;
    }
    if (valEl) valEl.textContent = `${Math.round(state.zoom * 100)}%`;
  };

  const fitWidth = () => {
    const avail = Math.max(240, viewport.clientWidth - 24);
    const ratio = Math.min(1, avail / svgWidth);
    applyZoom(ratio);
  };

  // 初始載入自動符合螢幕寬度（確保手機／平板不會被裁切）
  fitWidth();

  const btnIn = $("#zoomIn"), btnOut = $("#zoomOut"), btnFit = $("#zoomFit");
  if (btnIn) btnIn.addEventListener("click", () => applyZoom(state.zoom + 0.15));
  if (btnOut) btnOut.addEventListener("click", () => applyZoom(state.zoom - 0.15));
  if (btnFit) btnFit.addEventListener("click", fitWidth);

  // 滑鼠拖曳平移
  let isDown = false, startX = 0, startY = 0, scrollL = 0, scrollT = 0;
  viewport.addEventListener("mousedown", (e) => {
    if (e.target.closest(".svg-node")) return;
    isDown = true;
    startX = e.pageX - viewport.offsetLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollL = viewport.scrollLeft;
    scrollT = viewport.scrollTop;
  });
  window.addEventListener("mouseup", () => { isDown = false; });
  viewport.addEventListener("mousemove", (e) => {
    if (!isDown) return;
    e.preventDefault();
    viewport.scrollLeft = scrollL - (e.pageX - viewport.offsetLeft - startX);
    viewport.scrollTop = scrollT - (e.pageY - viewport.offsetTop - startY);
  });
}

// ===== 全文即時搜尋索引 =====
const SEARCH_INDEX = (() => {
  const list = [];
  REVISION_HISTORY.forEach(r => {
    list.push({ page: "history", title: `修改歷程｜${r.date}`, text: `${r.content} ${r.reason}` });
  });
  PART1_DUTY.steps.forEach(s => {
    list.push({ page: "part1", title: `壹、勤務作業程序｜${s.label.split("\n")[0]}`, text: `${s.label} ${s.details}` });
  });
  FLOWS.forEach(f => {
    list.push({ page: f.id, title: f.title, text: `${f.title} ${f.summary} ${f.nodes.map(n => n.lines.join(" ")).join(" ")}` });
    f.notes.forEach(n => {
      list.push({ page: f.id, noteId: n.id, title: `${f.title}（${n.id}）`, text: n.body });
    });
  });
  return list;
})();

function runSearch(q) {
  const box = $("#searchResults");
  const clearBtn = $("#searchClear");
  const kw = q.trim();
  clearBtn.classList.toggle("show", kw.length > 0);
  if (!kw) {
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }
  const kwLower = kw.toLowerCase();
  const hits = SEARCH_INDEX.filter(item =>
    item.title.toLowerCase().includes(kwLower) || item.text.toLowerCase().includes(kwLower)
  ).slice(0, 18);

  if (hits.length === 0) {
    box.innerHTML = `<div class="sr-empty">找不到與「${escapeHtml(kw)}」相符的手冊內容</div>`;
  } else {
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    box.innerHTML = hits.map((h, i) => {
      const idx = h.text.toLowerCase().indexOf(kwLower);
      const start = Math.max(0, idx - 22);
      const rawSnippet = (start > 0 ? "…" : "") + h.text.slice(start, start + 76) + (start + 76 < h.text.length ? "…" : "");
      const snippet = escapeHtml(rawSnippet).replace(re, m => `<mark>${m}</mark>`);
      return `
        <div class="search-result-item" data-sr-idx="${i}">
          <div class="sr-title">${escapeHtml(h.title)}</div>
          <div class="sr-snippet">${snippet}</div>
        </div>
      `;
    }).join("");
    box.querySelectorAll(".search-result-item").forEach(el => {
      el.addEventListener("click", () => {
        const hit = hits[Number(el.dataset.srIdx)];
        box.classList.remove("open");
        $("#searchWrap").classList.remove("mobile-open");
        navigate(hit.page, { highlightNote: hit.noteId || null });
      });
    });
  }
  box.classList.add("open");
}

$("#searchInput").addEventListener("input", (e) => runSearch(e.target.value));
$("#searchClear").addEventListener("click", () => {
  $("#searchInput").value = "";
  runSearch("");
  $("#searchInput").focus();
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#searchWrap") && !e.target.closest("#searchToggleBtn")) {
    $("#searchResults").classList.remove("open");
  }
});

// 啟動頁面（支援安全讀取 URL hash，例如 #flow-F，不影響 Google 協作平台內嵌）
try {
  const initHash = (window.location.hash || "").replace(/^#/, "");
  if (initHash && (initHash === "home" || initHash === "history" || initHash === "part1" || FLOWS.some(f => f.id === initHash))) {
    state.currentPage = initHash;
    const initFlow = FLOWS.find(f => f.id === initHash);
    if (initFlow && initFlow.walkthrough) {
      state.wtStep = initFlow.walkthrough.start;
      state.wtTrail = [initFlow.walkthrough.start];
    }
  }
} catch (e) {}
renderSidebar();
renderPage();
</script>
</body>
</html>
